name: AnyWhere
options:
  bundleIdPrefix: com.anywhere
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    # 版本默认值;发布时 scripts/release.sh 用 tag 覆盖 MARKETING_VERSION + 单调的 CURRENT_PROJECT_VERSION,
    # 经下方 Info.plist 的 $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) 注入 → Sparkle 跨版本比较才正确。
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 签名由 Local.xcconfig 控制（默认 ad-hoc；正式分发用 Developer ID）
targets:
  AnyWhereTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: AnyWhere
      - package: AnyWhereCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnyWhere:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["PresetScripts/**"]
      - path: App/PresetScripts
        buildPhase: resources
        optional: true
    dependencies:
      - package: AnyWhereCore
      - package: Sparkle
      - target: FinderExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AnyWhere
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        # Sparkle 自动更新:appcast 由发布流程更新到仓库,公钥用你的 EdDSA 公钥替换。见 docs/RELEASING.md。
        SUFeedURL: https://raw.githubusercontent.com/appdev/AnyWhere/main/appcast.xml
        SUPublicEDKey: REPLACE_WITH_YOUR_SPARKLE_PUBLIC_KEY
        # 默认后台检查，仅发现可用更新时提示；启动配置错误只记录日志。
        # 公钥和更新源配置有效后，手动「检查更新」也可用。
        SUEnableAutomaticChecks: true
        # 「前往上一层级目录 / 前往所在目录」等预设用 osascript 控制 Finder 做同窗导航；
        # 主 App 非沙盒，发 Apple Event 需声明此用途串，否则 macOS 自动化授权会被静默拒。
        NSAppleEventsUsageDescription: "AnyWhere 会在你启用的右键预设里控制 Finder，用于在当前窗口内导航（如「前往上一层级目录」「前往所在目录」）。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywhere.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FinderExtension:
    type: app-extension
    platform: macOS
    sources: [FinderExtension]
    dependencies:
      - package: AnyWhereCore
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: AnyWhere Finder Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywhere.app.FinderExtension
packages:
  AnyWhereCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
schemes:
  AnyWhere:
    build:
      targets:
        AnyWhere: all
    run:
      config: Debug
    test:
      targets: [AnyWhereTests]
