name: Release

# Tags require signing secrets. Manual releases can explicitly opt into an ad-hoc build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        type: string
      unsigned:
        description: Build without Developer ID / notarization / Sparkle updates
        type: boolean
        default: false

permissions:
  contents: write   # create releases + push appcast.xml

# Serialize releases so two tags can't race the appcast commit/push to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26   # The launcher's optional Liquid Glass background requires the macOS 26 SDK.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and target
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          UNSIGNED: ${{ inputs.unsigned }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Expected a version such as 0.1.0"; exit 1; }
          TAG="v$VERSION"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]] || { echo "Tag points to a different commit"; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "unsigned=$UNSIGNED"
          } >> "$GITHUB_OUTPUT"

      - name: Run core and preset tests
        run: |
          make test
          make test-presets

      - name: Import Developer ID certificate
        if: steps.version.outputs.unsigned != 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          KEYCHAINS=("$KEYCHAIN")
          while read -r KEYCHAIN_PATH; do
            KEYCHAINS+=("${KEYCHAIN_PATH//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build · sign · notarize · dmg · sparkle-sign
        if: steps.version.outputs.unsigned != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          cp Local.xcconfig.template Local.xcconfig
          echo "$NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          zsh scripts/release.sh "$VERSION"

      - name: Build universal ad-hoc app and DMG
        if: steps.version.outputs.unsigned == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make gen
          xcodebuild build \
            -project AnyWhere.xcodeproj -scheme AnyWhere -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            -quiet
          APP=build/Build/Products/Release/AnyWhere.app
          codesign --verify --deep --strict "$APP"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/AnyWhere"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/anywhere-mcp"
          mkdir -p build/release/dmg
          ditto "$APP" build/release/dmg/AnyWhere.app
          ln -s /Applications build/release/dmg/Applications
          hdiutil create -volname AnyWhere -srcfolder build/release/dmg \
            -ov -format UDZO "build/release/AnyWhere-$VERSION.dmg"
          hdiutil verify "build/release/AnyWhere-$VERSION.dmg"

      - name: Generate Sparkle appcast
        if: steps.version.outputs.unsigned != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          BIN=build/SourcePackages/artifacts/sparkle/Sparkle/bin
          mkdir -p build/release/feed
          cp build/release/AnyWhere-*.dmg build/release/feed/
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          "$BIN/generate_appcast" build/release/feed \
            --ed-key-file "$RUNNER_TEMP/sparkle_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          cp build/release/feed/appcast.xml appcast.xml

      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNSIGNED: ${{ steps.version.outputs.unsigned }}
        run: |
          cd build/release
          shasum -a 256 "AnyWhere-$VERSION.dmg" > SHA256SUMS.txt
          if [[ "$UNSIGNED" == true ]]; then
            cat > notes.md <<'EOF'
          macOS 13+ · Apple Silicon and Intel (universal).

          This build is ad-hoc signed. It is **not Developer ID signed or notarized** and does not provide Sparkle automatic updates. macOS Gatekeeper may block the first launch; see [installation guidance](https://github.com/AnyWhereTools/AnyWhere/blob/main/README.md#install--build-from-source).

          此版本支持 macOS 13+、Apple Silicon 与 Intel，采用 ad-hoc 签名，**未经 Developer ID 签名和 Apple 公证**，暂不支持 Sparkle 自动更新。首次启动可能被 macOS Gatekeeper 拦截。
          EOF
          else
            echo 'Developer ID signed and notarized macOS release.' > notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/release/AnyWhere-*.dmg build/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes \
            --notes-file build/release/notes.md --latest

      - name: Commit updated appcast
        if: steps.version.outputs.unsigned != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update appcast for ${RELEASE_TAG}"
          git push origin HEAD:main
